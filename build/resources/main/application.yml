management: # actuator가 사용하는 소것ㅇ들
  info: # 순서주의 이녀석은 바로 들어가서
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true
    health:
      show-components: always
#      show-details: always
  endpoints:
    web:
      exposure:
        include: "*" # 모든걸 actuator기능들을 노출하겠다는것

info: #이런설정을 남기고싶으면 info라고하는건 다남ㄴ느데
  app:
    name: hello-actuator #info밑에있는 외부 설정값을 보여줌
    company: yh
